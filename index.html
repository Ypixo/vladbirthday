<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f5f5f5">
<title>С днём рождения, Влад</title>
<meta name="description" content="Зажми экран">
<meta property="og:title" content="С днём рождения, Влад">
<meta property="og:description" content="Зажми экран">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' fill='%23fff' text-anchor='middle'%3E13%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --face: #f5f5f5;   /* светлая грань с шифровалкой */
    --fg: #ffffff;
    --muted: #7d7d7d;
    --fill: #8a8a8a;

    /* Сетка: макет 390×844, всё масштабируется от ширины устройства */
    --fs: clamp(11px, 3.03vw, 15px);      /* основной: 11.8px на 390 */
    --fs-s: clamp(9px, 2.52vw, 12.5px);   /* мелкий: «Сертификат», «Активируй», цифры */
    --side: max(clamp(16px, 6.2vw, 56px), env(safe-area-inset-left));
    --top: max(clamp(16px, 3.2dvh, 40px), env(safe-area-inset-top));
    --bottom: max(clamp(16px, 3.2dvh, 40px), env(safe-area-inset-bottom));
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    font-family: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    font-size: var(--fs);
    line-height: 1.3;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  .screen {
    position: fixed;
    inset: 0;
    height: 100vh;
    height: 100dvh;
  }

  /* ---------- Экран загрузки ---------- */
  #intro {
    /* светлая грань кубика: тёмный текст */
    --fg: #141414;
    --muted: #8c8c8c;
    --fill: #141414;
    color: var(--fg);
    background: var(--face);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  .d {
    position: absolute;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    transition: color .35s ease;
    will-change: transform;
  }
  .c-l { left: var(--side); }
  .c-c { left: 50%; transform: translateX(-50%); }
  .c-r { right: var(--side); }
  .r-1 { top: var(--top); }
  .r-2 { top: 24.5%; }
  .r-3 { top: 74.6%; }
  .r-4 { bottom: var(--bottom); }

  .center {
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.55em;
    pointer-events: none;
  }
  .title { color: var(--fg); white-space: pre; }
  .hint { position: relative; color: var(--muted); white-space: pre; }
  .hint-fill {
    position: absolute;
    inset: -0.08em 0;
    display: flex;
    align-items: center;
    background: var(--fill);
    color: var(--face);
    clip-path: inset(0 100% 0 0);
  }
  .ch { display: inline-block; white-space: pre; will-change: transform; transition: color .35s ease; }

  #intro.done .d, #intro.done .ch, #intro.done .hint { color: var(--fg); }
  #intro.done .hint-fill { opacity: 0; transition: opacity .2s; }

  /* ---------- Сертификат ---------- */
  #cert {
    background: var(--bg);
    opacity: 0;
    visibility: hidden;
    transition: opacity 1.1s ease;
  }
  #cert.show { opacity: 1; visibility: visible; }
  .cert-label { position: absolute; left: 0; right: 0; text-align: center; color: var(--muted); font-size: var(--fs-s); }
  .d { font-size: var(--fs-s); }
  .code-row { font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
  .hint.hint-bottom {
    position: absolute;
    left: 50%;
    bottom: var(--bottom);
    transform: translateX(-50%);
    font-size: var(--fs-s);
  }
  .cert-label.top { top: var(--top); }
  .cert-label.bottom { bottom: var(--bottom); }
  .amount { position: absolute; left: 0; right: 0; top: 29.5%; text-align: center; color: var(--fg); }
  .links {
    position: absolute; left: 0; right: 0; top: 68.4%;
    display: flex; flex-direction: column; align-items: center; gap: 1.05em;
  }
  .links button, .links a {
    font: inherit; color: var(--fg); background: none; border: 0;
    text-transform: uppercase; text-decoration: none; cursor: pointer;
    padding: 0.35em 0.6em; margin: -0.35em -0.6em;
    -webkit-tap-highlight-color: transparent;
    transition: opacity .2s;
  }
  .links button:active, .links a:active { opacity: .55; }
  @media (hover: hover) {
    .links button:hover, .links a:hover { opacity: .65; }
  }
  .code { position: relative; min-width: 11ch; }

  /* reveal-анимация элементов сертификата */
  #cert .rv { opacity: 0; transform: translateY(10px); transition: opacity .9s ease, transform .9s cubic-bezier(.2,.7,.2,1); }
  #cert.show .rv { opacity: 1; transform: none; }
  #cert.show .rv:nth-child(2) { transition-delay: .15s; }
  #cert.show .rv:nth-child(3) { transition-delay: .3s; }
  #cert.show .rv:nth-child(4) { transition-delay: .45s; }
  #cert.show .rv:nth-child(5) { transition-delay: .6s; }

  /* ---------- 3D-логотип ---------- */
  .logo-wrap {
    position: absolute;
    left: 50%; top: 49%;
    width: min(58vw, 52dvh, 560px);
    transform: translate(-50%, -50%);
    perspective: 1100px;
    cursor: grab;
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  .logo-wrap.dragging { cursor: grabbing; }
  #cert .logo-wrap.rv { transform: translate(-50%, calc(-50% + 10px)); }
  #cert.show .logo-wrap.rv { transform: translate(-50%, -50%); }
  .rot {
    position: relative;
    width: 100%;
    transform-style: preserve-3d;
    will-change: transform;
  }
  .rot img {
    display: block;
    width: 100%;
    height: auto;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .rot .layer { position: absolute; inset: 0; }
  .rot .front { position: relative; }
  .shine {
    position: absolute;
    inset: 0;
    pointer-events: none;
    mix-blend-mode: plus-lighter;
    -webkit-mask-size: 100% 100%;
            mask-size: 100% 100%;
    background: linear-gradient(105deg,
      transparent 0%, transparent 38%,
      rgba(255,255,255,.08) 44%, rgba(255,255,255,.75) 50%, rgba(255,255,255,.08) 56%,
      transparent 62%, transparent 100%);
    background-size: 260% 100%;
    background-repeat: no-repeat;
  }
  .glints { position: absolute; inset: 0; pointer-events: none; }
  .glint {
    position: absolute;
    width: 0; height: 0;
    mix-blend-mode: plus-lighter;
  }
  .glint svg {
    position: absolute;
    left: 0; top: 0;
    transform: translate(-50%, -50%) scale(0);
    overflow: visible;
  }

  /* ---------- Финалы ---------- */
  .date-row {
    position: absolute; left: 0; right: 0;
    display: flex; justify-content: center;
    white-space: pre;
  }
  .date-row span { visibility: hidden; }
  .date-row span.on { visibility: visible; color: var(--fg); animation: dotIn .4s ease both; }
  @keyframes dotIn { from { opacity: 0; } to { opacity: 1; } }
  .fx-plate { position: fixed; background: #fff; z-index: 10; pointer-events: none; }
  .fx-star { position: fixed; left: 50%; top: 50%; width: 0; height: 0; z-index: 11; pointer-events: none; }
  .fx-star svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .fx-glow {
    position: fixed; inset: 0; z-index: 10; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 50%, #fff 0%, #fff 45%, #e9eefc 100%);
  }
  #cert.instant, #cert.decode, #cert.cube { transition: none; }
  #cert.cube .rv { transition: none; }
  #cert.cube .rv:not(.logo-wrap) { opacity: 1; transform: none; }
  #cert.decode .rv:not(.logo-wrap) { transition: none; opacity: 1; transform: none; }

  @media (prefers-reduced-motion: reduce) {
    #cert, #cert .rv { transition-duration: .01s; }
  }
</style>
</head>
<body>

<main id="intro" class="screen" aria-label="Зажми экран">
  <span class="d c-l r-1">0</span>
  <span class="d c-c r-1">0</span>
  <span class="d c-c r-2">0</span>
  <span class="d c-r r-2">0</span>
  <span class="d c-l r-3">0</span>
  <span class="d c-c r-3">0</span>
  <span class="d c-c r-4">0</span>
  <span class="d c-r r-4">0</span>

  <div class="center">
    <div class="title">С ДНЕМ РОЖДЕНИЯ, ВЛАД</div>
    <div class="hint"><span class="hint-base">ЖМИ НА ЭКРАН</span><span class="hint-fill" aria-hidden="true">ЖМИ НА ЭКРАН</span></div>
  </div>
</main>

<section id="cert" class="screen" aria-label="Сертификат">
  <div class="cert-label top rv">Сертификат</div>
  <div class="amount rv">3&nbsp;000&nbsp;₽</div>
  <div class="logo-wrap rv" id="logo">
    <div class="rot" id="rot"></div>
  </div>
  <div class="links rv">
    <button class="code" id="code" type="button" aria-label="Скопировать промокод SEZM22">SEZM22</button>
    <a href="https://www.mrwolee.com" target="_blank" rel="noopener">www.mrwolee.com</a>
  </div>
  <div class="cert-label bottom rv">Активируй до 11.05.2027</div>
</section>

<script>
(() => {
  /* ================= ЭКРАН ЗАГРУЗКИ ================= */
  const intro = document.getElementById('intro');
  const digits = [...intro.querySelectorAll('.d')];
  const TARGETS = [1, 3, 1, 1, 2, 0, 2, 6];          // 13 · 11 · 20 · 26
  const HOLD_TIME = 3.4;                              // секунд удержания до 100%
  const DRAIN_SPEED = 2.2;                            // во сколько раз быстрее откатывается

  // Каждая цифра «засчитывается» по очереди: 0→1, 0→1→2→3, …
  // Цифра с целью 0 занимает один шаг (просто «проходится»).
  const steps = TARGETS.map(t => Math.max(t, 1));
  const totalSteps = steps.reduce((a, b) => a + b, 0);

  const title = intro.querySelector('.title');
  const hint = intro.querySelector('.hint');
  const fill = intro.querySelector('.hint-fill');

  // Разбиваем текст на отдельные символы — для перебора и анимаций
  const splitChars = el => {
    const text = el.textContent;
    el.textContent = '';
    return [...text].map(ch => {
      const s = document.createElement('span');
      s.className = 'ch';
      s.textContent = ch;
      el.appendChild(s);
      return s;
    });
  };
  /* Версия 2 (по умолчанию): в центре восемь нулей, зажатие запускает
     перебор цифр, расшифровка слева направо даёт 13112026.
     ?v=1 — старая версия с «С ДНЕМ РОЖДЕНИЯ, ВЛАД» и разбросанными цифрами. */
  const V2 = !/[?&]v=1(&|$)/.test(location.search);
  const DATE2 = '13112026';
  if (V2) {
    digits.forEach(d => d.remove());
    digits.length = 0;
    title.textContent = '00000000';
    title.classList.add('code-row');
    intro.appendChild(hint);
    hint.classList.add('hint-bottom');
  }
  const titleChars = splitChars(title);

  let progress = 0, holding = false, finished = false, last = performance.now();
  let lastScramble = 0;

  const render = () => {
    fill.style.clipPath = `inset(0 ${(1 - progress) * 100}% 0 0)`;
    if (V2) {
      // первые 15% — чистый перебор, потом цифры фиксируются по одной слева направо
      const locked = Math.floor(Math.max(0, (progress - 0.15) / 0.85) * 8 + 1e-6);
      const now = performance.now();
      const tickScr = now - lastScramble > 55;
      if (tickScr) lastScramble = now;
      titleChars.forEach((c, i) => {
        if (i < locked) { if (c.textContent !== DATE2[i]) c.textContent = DATE2[i]; }
        else if (holding) { if (tickScr) c.textContent = (Math.random() * 10) | 0; }
        else if (c.textContent !== '0') c.textContent = '0';
      });
      return;
    }
    let rem = progress * totalSteps;
    digits.forEach((d, i) => {
      const s = steps[i];
      const done = Math.max(0, Math.min(s, rem));
      rem -= s;
      const val = TARGETS[i] === 0 ? 0 : Math.floor(done + 1e-6);
      if (d.textContent !== String(val)) d.textContent = val;
    });
  };

  const tick = now => {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!finished) {
      if (holding) progress = Math.min(1, progress + dt / HOLD_TIME);
      else progress = Math.max(0, progress - dt * DRAIN_SPEED / HOLD_TIME);
      render();
      if (progress >= 1) return complete();
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);

  const down = e => { if (!finished) { holding = true; e.preventDefault && e.preventDefault(); } };
  const up = () => { holding = false; };
  intro.addEventListener('pointerdown', down);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
  intro.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    if (finished) return;
    if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) { holding = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') holding = false; });
  // свернули вкладку / ушли из окна — отпускаем, чтобы загрузка не «залипала»
  window.addEventListener('blur', up);
  document.addEventListener('visibilitychange', () => { if (document.hidden) up(); });

  /* ================= ФИНАЛЫ =================
     ?f=1 — плашка разливается на весь экран
     ?f=2 — перебор символов, текст «оседает» в сертификат
     ?f=3 — цифры собираются в дату 13.11.2026
     ?f=4 — вспышка-звёздочка
     ?f=5 — связка 3 + 1
     ?f=6 — кубик (по умолчанию)
     Для отладки: ?cert — сразу сертификат, ?skip — пропустить зажатие. */
  const FINALE = (location.search.match(/[?&]f=(\d)/) || [, '6'])[1];   // 6 — кубик (по умолчанию)
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const ease = 'cubic-bezier(.7,0,.2,1)';
  const GLYPHS = '0123456789ABCDEFGHJKLMNPRSTUVXYZБГДЖЗИЛПФЦЧШЭЮЯ#%*/+=<>';
  const rnd = () => GLYPHS[(Math.random() * GLYPHS.length) | 0];

  async function complete() {
    finished = true;
    holding = false;
    if (navigator.vibrate) navigator.vibrate(30);
    intro.classList.add('done');            // всё становится 100% яркости
    await wait(550);
    const run = { 1: finalePlate, 2: finaleScramble, 3: finaleDate, 4: finaleStar, 5: finaleDatePlate, 6: finaleCube }[FINALE] || finaleCube;
    run();
  }

  /* --- 6. Кубик: экран с цифрами уходит гранью влево, сертификат заезжает справа --- */
  async function finaleCube() {
    await wait(350);
    cert.classList.add('cube', 'show');
    startLogo();
    const P = 'perspective(1600px)';
    const opts = { duration: 1250, easing: 'cubic-bezier(.65,0,.3,1)', fill: 'forwards' };
    intro.style.transformOrigin = '100% 50%';
    cert.style.transformOrigin = '0% 50%';
    intro.style.backfaceVisibility = cert.style.backfaceVisibility = 'hidden';
    const out = intro.animate([
      { transform: `${P} translateX(0) rotateY(0deg)`, filter: 'brightness(1)' },
      { transform: `${P} translateX(-100%) rotateY(-90deg)`, filter: 'brightness(.55)' },
    ], opts);
    const inn = cert.animate([
      { transform: `${P} translateX(100%) rotateY(90deg)`, filter: 'brightness(.45)' },
      { transform: `${P} translateX(0) rotateY(0deg)`, filter: 'brightness(1)' },
    ], opts);
    await Promise.all([out.finished, inn.finished]);
    intro.style.display = 'none';
    document.querySelector('meta[name=theme-color]').content = '#000000';
    inn.cancel();   // снимаем transform/filter, чтобы 3D-логотип снова был объёмным
    cert.style.transformOrigin = '';
  }

  function showCert(mode) {
    intro.style.display = 'none';
    document.querySelector('meta[name=theme-color]').content = '#000000';
    if (mode) cert.classList.add(mode);
    cert.classList.add('show');
    startLogo();
  }

  /* --- 1. Плашка: вширь → ввысь → белый экран → схлопывается в линию --- */
  async function finalePlate(originEl) {
    const W = innerWidth, H = innerHeight;
    const r = (originEl || fill).getBoundingClientRect();
    const fx = document.createElement('div');
    fx.className = 'fx-plate';
    document.body.appendChild(fx);
    const box = (x, y, w, h) => ({ left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
    const a = box(r.left, r.top, r.width, r.height);
    const b = box(0, r.top, W, r.height);
    const c = box(0, 0, W, H);
    await fx.animate([{ ...a, background: '#8a8a8a' }, { ...a, background: '#fff', offset: .3 }, { ...b, background: '#fff' }],
      { duration: 650, easing: ease, fill: 'forwards' }).finished;
    await fx.animate([b, c], { duration: 600, easing: ease, fill: 'forwards' }).finished;
    showCert('instant');
    await wait(120);
    const line = box(0, H / 2 - 1, W, 2);
    await fx.animate([c, line], { duration: 650, easing: ease, fill: 'forwards' }).finished;
    await fx.animate([line, box(W / 2, H / 2 - 1, 0, 2)], { duration: 380, easing: ease, fill: 'forwards' }).finished;
    fx.remove();
  }

  /* --- 2. Перебор символов → текст сертификата --- */
  async function finaleScramble() {
    const els = [...digits, ...titleChars];
    hint.textContent = 'ЖМИ НА ЭКРАН';
    const hintChars = splitChars(hint);
    els.push(...hintChars);
    const t0 = performance.now();
    await new Promise(res => {
      const id = setInterval(() => {
        const t = (performance.now() - t0) / 900;
        els.forEach(e => { if (e.textContent.trim()) e.textContent = rnd(); });
        intro.style.opacity = Math.max(0, 1 - Math.max(0, t - 0.45) / 0.55);
        if (t >= 1) { clearInterval(id); res(); }
      }, 45);
    });
    showCert('decode');
    const texts = [...cert.querySelectorAll('.cert-label, .amount, #code, .links a')];
    texts.forEach((el, i) => decode(el, el.textContent, 900 + i * 60, i * 90));
  }

  function decode(el, text, dur, delay) {
    const chars = [...text];
    el.textContent = chars.map(c => c.trim() ? rnd() : c).join('');
    const t0 = performance.now() + delay;
    const id = setInterval(() => {
      const t = (performance.now() - t0) / dur;
      if (t < 0) { el.textContent = chars.map(c => c.trim() ? rnd() : c).join(''); return; }
      const n = Math.floor(Math.min(1, t) * chars.length);
      el.textContent = chars.map((c, i) => i < n || !c.trim() ? c : rnd()).join('');
      if (t >= 1) { clearInterval(id); el.textContent = text; }
    }, 40);
  }

  /* --- 3. Цифры съезжаются в дату под заголовком --- */
  async function gatherDate() {
    const center = intro.querySelector('.center');
    const row = document.createElement('div');
    row.className = 'date-row';
    row.style.top = hint.offsetTop + 'px';
    const DATE = '13.11.2026';
    const slots = [...DATE].map(ch => {
      const s = document.createElement('span');
      s.textContent = ch;
      row.appendChild(s);
      return s;
    });
    center.appendChild(row);

    hint.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' });
    const digitSlots = slots.filter(s => s.textContent !== '.');
    const moves = digits.map((d, i) => {
      const from = d.getBoundingClientRect();
      const to = digitSlots[i].getBoundingClientRect();
      const base = getComputedStyle(d).transform;
      const b = base === 'none' ? '' : ' ' + base;
      const dx = to.left - from.left, dy = to.top - from.top;
      return d.animate([
        { transform: `translate(0,0)${b}` },
        { transform: `translate(${dx}px, ${dy}px)${b}` },
      ], { duration: 1100, delay: i * 70, easing: ease, fill: 'forwards' }).finished;
    });
    await Promise.all(moves);
    slots.filter(s => s.textContent === '.').forEach(s => s.classList.add('on'));
    return row;
  }

  async function finaleDate() {
    if (!V2) await gatherDate();
    await wait(1600);
    await intro.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 700, easing: 'ease', fill: 'forwards' }).finished;
    showCert();
  }

  /* --- 5. Связка: дата → плашка разливается от строки с датой --- */
  async function finaleDatePlate() {
    const row = V2 ? title : await gatherDate();
    if (V2) hint.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 400, fill: 'forwards' });
    await wait(V2 ? 1100 : 1400);

    const p = document.createElement('div');

    Object.assign(p.style, { left: r.left + 'px', top: r.top - r.height * 0.06 + 'px', width: r.width + 'px', height: r.height * 1.12 + 'px' });
    document.body.appendChild(p);
    await p.animate([{ clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)' }], { duration: 500, easing: ease, fill: 'forwards' }).finished;
    p.remove();
    const holder = document.createElement('div');
    Object.assign(holder.style, { position: 'fixed', left: r.left + 'px', top: r.top - r.height * 0.06 + 'px', width: r.width + 'px', height: r.height * 1.12 + 'px' });
    document.body.appendChild(holder);
    await finalePlate(holder);
    holder.remove();
  }

  async function finaleStar() {
    const star = document.createElement('div');
    star.className = 'fx-star';
    star.innerHTML = starSVG(Math.min(innerWidth, innerHeight) * 0.42);
    document.body.appendChild(star);
    const glow = document.createElement('div');
    glow.className = 'fx-glow';
    document.body.appendChild(glow);
    const svg = star.firstChild;
    intro.animate([{ opacity: 1 }, { opacity: 0.25 }], { duration: 900, fill: 'forwards' });
    await svg.animate([
      { transform: 'translate(-50%,-50%) scale(0) rotate(-20deg)', opacity: 0 },
      { transform: 'translate(-50%,-50%) scale(1) rotate(10deg)', opacity: 1 },
    ], { duration: 650, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' }).finished;
    await svg.animate([
      { transform: 'translate(-50%,-50%) scale(1) rotate(10deg)' },
      { transform: 'translate(-50%,-50%) scale(1.15) rotate(28deg)' },
    ], { duration: 450, easing: 'ease-in-out', fill: 'forwards' }).finished;
    svg.animate([
      { transform: 'translate(-50%,-50%) scale(1.15) rotate(28deg)' },
      { transform: 'translate(-50%,-50%) scale(14) rotate(60deg)' },
    ], { duration: 700, easing: 'cubic-bezier(.6,0,.9,.4)', fill: 'forwards' });
    await glow.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 700, easing: 'cubic-bezier(.6,0,.9,.4)', fill: 'forwards' }).finished;
    star.remove();
    showCert('instant');
    await wait(150);
    await glow.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1100, easing: 'ease-out', fill: 'forwards' }).finished;

  }

    const w = src.naturalWidth, h = src.naturalHeight;
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(src, 0, 0);
    const img = ctx.getImageData(0, 0, w, h);
    const p = img.data;
    let x0 = w, y0 = h, x1 = 0, y1 = 0;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const m = Math.max(p[i], p[i + 1], p[i + 2]);
      const a = Math.min(1, Math.max(0, (m - 10) / 38));
      p[i + 3] = Math.round(a * 255);
      if (a > 0.5) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    ctx.putImageData(img, 0, 0);
    const pad = 6;
    x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
    x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);
    const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
    const out = document.createElement('canvas');
    out.width = cw; out.height = ch;
    const octx = out.getContext('2d');
    octx.drawImage(cv, x0, y0, cw, ch, 0, 0, cw, ch);

    // Самые яркие точки — места для бликов-звёздочек
    const od = octx.getImageData(0, 0, cw, ch).data;

      const i = (y * cw + x) * 4;
      if (od[i] > 236 && od[i + 1] > 236 && od[i + 2] > 236) glintPoints.push([x / cw, y / ch]);
    }

    buildLogo(url, cw / ch);

  let shineEl, glintsEl;
  function buildLogo(url, aspect) {
    rot.style.aspectRatio = aspect;
    // Задние слои — «толщина» металла, чем глубже, тем темнее
    for (let i = LAYERS; i >= 1; i--) {
      const im = new Image();
      im.src = url; im.alt = '';
      im.className = 'layer';
      const t = i / LAYERS;
      im.style.transform = `translateZ(calc(${-t * DEPTH} * var(--lh)))`;
      im.style.filter = `brightness(${(0.95 - t * 0.55).toFixed(2)}) contrast(1.15)`;
      rot.appendChild(im);
    }
    const front = new Image();
    front.src = url; front.alt = 'Wolee';
    front.className = 'front';
    rot.appendChild(front);

    shineEl = document.createElement('div');
    shineEl.className = 'shine';
    shineEl.style.webkitMaskImage = shineEl.style.maskImage = `url(${url})`;
    shineEl.style.transform = 'translateZ(0.5px)';
    rot.appendChild(shineEl);

    glintsEl = document.createElement('div');
    glintsEl.className = 'glints';
    glintsEl.style.transform = 'translateZ(1px)';
    rot.appendChild(glintsEl);

    const setLH = () => rot.style.setProperty('--lh', rot.getBoundingClientRect().height / Math.cos(0) + 'px');
    setLH();
    window.addEventListener('resize', setLH);
  }

  function startLogo() {
    logoStarted = true;
    if (logoReady) animateLogo();
  }

  // Вращение: в покое — плавное покачивание, пальцем/мышью — свободно крутится с инерцией
  let angle = 0, vel = 0, dragging = false, lastX = 0, lastT = 0, tiltX = 0, tiltTarget = 0;
  let idleBlend = 1;

  logoWrap.addEventListener('pointerdown', e => {
    dragging = true; lastX = e.clientX; lastT = performance.now(); vel = 0;
    logoWrap.classList.add('dragging');
    logoWrap.setPointerCapture(e.pointerId);
  });
  logoWrap.addEventListener('pointermove', e => {
    if (!dragging) {
      if (e.pointerType === 'mouse') {
        const r = logoWrap.getBoundingClientRect();
        tiltTarget = ((e.clientY - r.top) / r.height - 0.5) * -14;
      }
      return;
    }
    const now = performance.now();
    const dx = e.clientX - lastX;
    const dAng = dx * 0.45;
    angle += dAng;
    vel = dAng / Math.max(1, now - lastT) * 1000;
    lastX = e.clientX; lastT = now;
  });
  const release = () => { dragging = false; logoWrap.classList.remove('dragging'); };
  logoWrap.addEventListener('pointerup', release);
  logoWrap.addEventListener('pointercancel', release);
  logoWrap.addEventListener('pointerleave', () => { tiltTarget = 0; });

  let animating = false;
  function animateLogo() {
    if (animating) return;
    animating = true;
    let prev = performance.now(), clock = 0, nextGlint = 0;
    const frame = now => {
      const dt = Math.min(0.05, (now - prev) / 1000);
      prev = now; clock += dt;

      if (!dragging) {
        // инерция после броска
        angle += vel * dt;
        vel *= Math.pow(0.04, dt);
        if (Math.abs(vel) < 25) {
          // мягко возвращаемся к ближайшему «лицу» и покачиваемся
          const face = Math.round(angle / 360) * 360;
          const sway = Math.sin(clock * 0.9) * 26;
          const target = face + sway;
          angle += (target - angle) * Math.min(1, dt * 2.2);
        }
      }
      tiltX += (tiltTarget + Math.sin(clock * 0.7) * 4 - tiltX) * Math.min(1, dt * 4);
      const L3 = window.__logo3d;
      if (L3 && L3.ready) {
        if (!L3.mounted) mount3D(L3);
        L3.render(angle, tiltX, clock);
      } else {
        rot.style.transform = `rotateX(${tiltX}deg) rotateY(${angle}deg)`;
      }

      // Блик едет по металлу в зависимости от угла поворота
      if (shineEl) {
        const a = ((angle % 360) + 360) % 360;
        const k = Math.sin(a * Math.PI / 180);
        const pos = 50 + k * 70 + Math.sin(clock * 0.6) * 12;
        shineEl.style.backgroundPosition = `${pos}% 0`;
        shineEl.style.opacity = (0.55 + 0.45 * Math.abs(k)).toFixed(2);
      }

      // Звёздочки-вспышки как у подвески
      if (glintsEl && clock > nextGlint && (glintPoints.length || (L3 && L3.mounted))) {
        spawnGlint();
        nextGlint = clock + 0.18 + Math.random() * 0.45;
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  function starSVG(size) {
    const s = size, l = s * 0.5, t = s * 0.035, d = s * 0.22, td = s * 0.02;
    return `<svg width="${s}" height="${s}" viewBox="${-s/2} ${-s/2} ${s} ${s}">
      <defs>
        <radialGradient id="gg"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".25" stop-color="#dfe8ff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      </defs>
      <circle r="${s*0.16}" fill="url(#gg)"/>
      <path d="M0 ${-l} L${t} 0 L0 ${l} L${-t} 0Z" fill="#fff"/>
      <path d="M${-l} 0 L0 ${t} L${l} 0 L0 ${-t}Z" fill="#fff"/>
      <g transform="rotate(45)" opacity=".65">
        <path d="M0 ${-d} L${td} 0 L0 ${d} L${-td} 0Z" fill="#fff"/>
        <path d="M${-d} 0 L0 ${td} L${d} 0 L0 ${-td}Z" fill="#fff"/>
      </g>
    </svg>`;
  }

  // Переключение на настоящий 3D (Three.js), если WebGL доступен
  function mount3D(L3) {
    L3.mounted = true;
    logoWrap.style.aspectRatio = L3.aspect;
    rot.style.position = 'absolute';
    rot.style.visibility = 'hidden';
    logoWrap.appendChild(L3.canvas);
    glintsEl = document.createElement('div');
    glintsEl.className = 'glints';
    logoWrap.appendChild(glintsEl);
    L3.resize();
  }

  function spawnGlint() {
    const L3 = window.__logo3d;
    let px, py;
    if (L3 && L3.mounted) {
      const pt = L3.samplePoint();          // точка на поверхности металла → координаты на экране
      if (!pt) return;
      [px, py] = pt;
    } else {
      [px, py] = glintPoints[(Math.random() * glintPoints.length) | 0];
    }
    const g = document.createElement('div');
    g.className = 'glint';
    g.style.left = px * 100 + '%';
    g.style.top = py * 100 + '%';
    const W = logoWrap.getBoundingClientRect().width || 200;
    const size = W * (0.12 + Math.random() * 0.14);
    g.innerHTML = starSVG(size);
    glintsEl.appendChild(g);
    const svg = g.firstChild;
    const r0 = Math.random() * 20 - 10;
    const dur = 700 + Math.random() * 600;
    svg.animate([
      { transform: `translate(-50%,-50%) scale(0) rotate(${r0}deg)`, opacity: 0 },
      { transform: `translate(-50%,-50%) scale(1) rotate(${r0 + 15}deg)`, opacity: 1, offset: 0.4 },
      { transform: `translate(-50%,-50%) scale(0) rotate(${r0 + 35}deg)`, opacity: 0 },
    ], { duration: dur, easing: 'ease-in-out' }).onfinish = () => g.remove();
  }

  // Для разработки: ?cert — сразу открыть сертификат
  if (location.search.includes('cert')) { finished = true; showCert(); }
  // ?skip — пропустить зажатие и сразу проиграть финал
  if (location.search.includes('skip')) { progress = 1; render(); complete(); }
})();
</script>

    camera.aspect = w / h;
    // логотип (ширина 1) должен занимать 1/1.6 ширины холста
    const visW = 1.6;
    camera.position.set(0, 0, visW / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect));
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();
  };
  addEventListener('resize', () => L3.mounted && L3.resize());

  L3.render = (angleDeg, tiltDeg, t) => {
    pivot.rotation.set(THREE.MathUtils.degToRad(tiltDeg), THREE.MathUtils.degToRad(angleDeg), 0);
    // отражения медленно «текут» по металлу, даже когда логотип стоит
    if (scene.environmentRotation) {
      scene.environmentRotation.set(Math.sin(t * 0.23) * 0.35, Math.sin(t * 0.17) * 0.6, Math.sin(t * 0.13) * 0.25);
    }
    renderer.render(scene, camera);
  };

  // Случайная точка на лицевой стороне букв → проценты внутри обёртки логотипа
  const v = new THREE.Vector3();
  L3.samplePoint = () => {
    const facing = Math.cos(pivot.rotation.y) * Math.cos(pivot.rotation.x);
    if (Math.abs(facing) < 0.35) return null;
    v.copy(glintLocal[(Math.random() * glintLocal.length) | 0]);
    if (facing < 0) v.z = -v.z;
    v.applyMatrix4(group.matrixWorld).project(camera);
    const cx = (v.x + 1) / 2 * 1.6 - 0.3;   // в долях ширины обёртки
    const cy = (1 - v.y) / 2 * 2.2 - 0.6;   // в долях высоты обёртки
    return [cx, cy];
  };

  L3.ready = true;
} catch (e) {
  console.warn('3D-логотип недоступен, остаётся плоская версия', e);
}
window.__logo3d = L3;
</script>
